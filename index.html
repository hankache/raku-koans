<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn Raku by fixing small failing tests, right in your browser." />
    <title>Raku Koans</title>
    <script>
      // Choose the theme before anything is drawn, so the page never flashes the wrong one:
      // the visitor's saved choice, or else the system setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('raku-koans:theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <!-- PNG first, SVG last: Firefox takes the last icon, and the SVG adapts to dark tabs.
         sizes="32x32" keeps Chrome choosing the SVG too. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Start fetching the interpreter while the app boots. -->
    <link rel="prefetch" href="/runtime/rakujs.wasm" as="fetch" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
